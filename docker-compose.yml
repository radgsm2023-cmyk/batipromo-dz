version: '3.8'

services:
  batipromo:
    build:
      context: .
      dockerfile: Dockerfile
    image: batipromo-dz:latest
    container_name: batipromo-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=batipromo_algerie_secret_production_2026
    volumes:
      - batipromo_uploads:/app/server/uploads
      - batipromo_db:/app/data

volumes:
  batipromo_uploads:
  batipromo_db:
